services:
  # Redis service
  redis:
    image: redis:6.2
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

#  redisinsight:
#    image: redis/redisinsight:2.66
#    container_name: redis-insight
#    ports:
#      - "5540:8001"
#    environment:
#      - RI_HOST=0.0.0.0
#    depends_on:
#      - redis

  #   PostgreSQL service (commented out by default)
  postgres:
    image: postgres:14
    container_name: booking-be
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: booking-be
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
#    networks:
#      - mynetwork
  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z-cpuv1
    container_name: minio
    ports:
      - "9000:9000"      # API
      - "9001:9001"      # Web UI
    environment:
      MINIO_ROOT_USER: minio_client         # Username đăng nhập
      MINIO_ROOT_PASSWORD: minio_client     # Mật khẩu đăng nhập
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # rabbitmq:
  #   image: rabbitmq:3-management
  #   container_name: rabbitmq
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"
  #   environment:
  #     RABBITMQ_DEFAULT_USER: admin
  #     RABBITMQ_DEFAULT_PASS: admin
  #   volumes:
  #     - rabbitmq_data:/var/lib/rabbitmq
  #   networks:
  #     - mynetwork

volumes:
  redis_data: { }
  postgres_data: { }
  minio-data: { }
#  rabbitmq_data: { }

