services:
  # Redis service
  redis:
    image: redis:6.2
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redisinsight:
    image: redis/redisinsight:2.66
    container_name: redis-insight
    ports:
      - "5540:8001"
    environment:
      - RI_HOST=0.0.0.0
    depends_on:
      - redis

